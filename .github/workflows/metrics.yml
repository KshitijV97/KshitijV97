name: Refresh profile metrics

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (off the hour to avoid queue spikes)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_metrics.py, .github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_metrics.py --user "${{ github.repository_owner }}" --json metrics.json
      - name: Commit if changed
        run: |
          # The timestamp line always changes; only commit when a number moved.
          if git diff --quiet -I 'last run|"updated"' -- README.md metrics.json; then
            echo "No metric changed."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics.json
          git commit -m "Refresh profile metrics"
          git push
